# Local backend: PostgreSQL + the API.  Start: docker compose up -d --build
# Both ports are bound to 127.0.0.1, so nothing is reachable from other machines.
# DB_PASSWORD comes from .env; without one, a local-only default is used (never use it on a real server).
name: moba

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: moba
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      POSTGRES_DB: moba
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moba -d moba"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./src/Moba.Api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=moba;Username=moba;Password=${DB_PASSWORD:-local-dev-only};Gss Encryption Mode=Disable"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
